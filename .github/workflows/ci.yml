name: CI
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run pytest --cov --cov-report=term-missing
      - name: Committed case-study runs still diff the same way
        run: |
          set +e
          uv run agenttrace diff examples/runs/before.jsonl examples/runs/after.jsonl --json > /tmp/d.json
          test $? = 1 || exit 1
          set -e
          uv run python -c "
          import json
          now = json.load(open('/tmp/d.json')); was = json.load(open('results/case-study-diff.json'))
          assert now == was, 'diff output changed'
          print('first divergence:', now['first_divergence']['a'])"
          uv run agenttrace diff examples/runs/before.jsonl examples/runs/before-replayed.jsonl

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/setup-node@v4
        with: { node-version: '22', cache: 'npm', cache-dependency-path: viewer/package-lock.json }
      - run: npm ci --prefix viewer
      - run: npm --prefix viewer test
      - run: npm --prefix viewer run build
