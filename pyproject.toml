[project]
name = "agenttrace"
version = "0.1.0"
description = "Record, replay and diff LLM agent runs (LangGraph + MCP)"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[project.optional-dependencies]
langgraph = ["langchain-core>=1.0", "langgraph>=1.0"]
mcp = ["mcp>=1.20", "httpx>=0.27", "starlette>=0.40", "uvicorn>=0.30"]

[project.scripts]
agenttrace = "agenttrace.cli:main"

[dependency-groups]
dev = [
  "pytest>=8", "pytest-cov>=5", "pytest-asyncio>=0.24", "ruff>=0.6", "mypy>=1.11",
  "langchain-core>=1.0", "langgraph>=1.0", "mcp>=1.20", "httpx>=0.27", "starlette>=0.40", "uvicorn>=0.30",
  "langchain-ollama>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 110
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.mypy]
strict = true
packages = ["agenttrace"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["langchain_core.*", "langgraph.*", "mcp.*", "uvicorn.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["agenttrace"]
branch = true
patch = ["subprocess"]
parallel = true

[tool.coverage.report]
fail_under = 85
show_missing = true

[tool.ruff.lint.per-file-ignores]
"bench/report.py" = ["E501", "RUF001"]
